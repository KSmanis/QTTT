import org.gradle.api.tasks.compile.JavaCompile

plugins {
    id 'com.android.application'
    id 'app.cash.paparazzi'
    id 'com.diffplug.spotless'
}

android {
    namespace = 'com.gmail.smanis.konstantinos.qttt'
    compileSdk = 37

    defaultConfig {
        applicationId "com.gmail.smanis.konstantinos.qttt"
        minSdk = 23
        targetSdk = 36
        versionCode 4
        versionName "1.0.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            optimization {
                enable = true
            }
        }
    }
    testOptions {
        animationsDisabled = true
        managedDevices {
            localDevices {
                create("pixel2Api36") {
                    device = "Pixel 2"
                    sdkVersion = 36
                    systemImageSource = "aosp-atd"
                    testedAbi = "x86_64"
                }
            }
        }
    }
}

def javaVersion = rootProject.file('.java-version').text.trim().toInteger()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

def openingBookClasses = layout.buildDirectory.dir('opening-book/classes')
def openingBookSources = files(
    'src/main/java/com/gmail/smanis/konstantinos/qttt/GameResult.java',
    'src/main/java/com/gmail/smanis/konstantinos/qttt/Move.java',
    'src/main/java/com/gmail/smanis/konstantinos/qttt/State.java',
    'src/main/java/com/gmail/smanis/konstantinos/qttt/Utility.java',
    rootProject.file('tools/OpeningBookGenerator.java')
)

def compileOpeningBookGenerator = tasks.register('compileOpeningBookGenerator', JavaCompile) {
    source(openingBookSources)
    destinationDirectory.set(openingBookClasses)
    classpath = files()
    options.release.set(javaVersion)
    options.encoding = 'UTF-8'
}

tasks.register('generateOpeningBook', JavaExec) {
    def openingBookTurn = providers.gradleProperty('turn').orElse('')

    dependsOn(compileOpeningBookGenerator)
    classpath = files(openingBookClasses)
    mainClass.set('com.gmail.smanis.konstantinos.qttt.OpeningBookGenerator')
    workingDir(rootProject.projectDir)
    doFirst {
        args(openingBookTurn.get())
    }
}

spotless {
    java {
        target 'src/*/java/**/*.java'
        removeUnusedImports()
        googleJavaFormat().aosp()
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
