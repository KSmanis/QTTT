name: release-please
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: simple
  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    environment: play-production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: java sops
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Decrypt release credentials
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          mise exec -- sops decrypt --input-type json --output-type binary --output "$RUNNER_TEMP/upload.keystore" .github/play-upload.keystore.enc.json
          mise exec -- sops decrypt --output "$RUNNER_TEMP/play-service-account.json" .github/play-service-account.enc.json
      - name: Build release bundle
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/upload.keystore
        run: mise exec -- sops exec-env enc.env './gradlew --no-daemon :app:bundleRelease'
      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ runner.temp }}/play-service-account.json
          packageName: com.gmail.smanis.konstantinos.qttt
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          tracks: production
          status: completed
