name: test
on: [pull_request, push, workflow_dispatch]
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
permissions:
  contents: read
jobs:
  gradle:
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        id:
          - assembleDebug
          - bundleRelease
          - compileOpeningBookGenerator
          - lintDebug
          - pixel2Api27DebugAndroidTest
          - pixel2Api36DebugAndroidTest
          - pixel2Api37DebugAndroidTest
          - verifyPaparazziDebug
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: java
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false
          packages: ${{ matrix.id == 'pixel2Api27DebugAndroidTest' && 'emulator' || '' }} platform-tools
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM
        if: endsWith(matrix.id, 'DebugAndroidTest')
        run: sudo chmod 666 /dev/kvm
      - name: Run Gradle task
        run: >-
          ./gradlew --no-daemon
          ${{ endsWith(matrix.id, 'DebugAndroidTest') && '-Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect' || '' }}
          :app:${{ matrix.id }}
      - name: Upload Android test reports
        if: failure() && endsWith(matrix.id, 'DebugAndroidTest')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-test-reports-${{ matrix.id }}
          path: |
            app/build/reports/androidTests/managedDevice/**
            app/build/outputs/androidTest-results/managedDevice/**
