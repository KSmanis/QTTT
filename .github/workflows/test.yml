name: test
on: [pull_request, push, workflow_dispatch]
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
permissions:
  contents: read
jobs:
  gradle:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        id: [assembleDebug, lintDebug, verifyPaparazziDebug, pixel2Api36DebugAndroidTest, bundleRelease]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .java-version
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Enable KVM
        if: matrix.id == 'pixel2Api36DebugAndroidTest'
        run: sudo chmod 666 /dev/kvm
      - name: Run Gradle task
        run: >-
          ./gradlew --no-daemon
          ${{ matrix.id == 'pixel2Api36DebugAndroidTest' && '-Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect' || '' }}
          :app:${{ matrix.id }}
